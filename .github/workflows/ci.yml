name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Phoenix.Mediator.slnx

      - name: Build
        run: dotnet build Phoenix.Mediator.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Phoenix.Mediator.slnx -c Release --no-build --verbosity normal
