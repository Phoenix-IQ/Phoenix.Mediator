name: CI

# Pull requests only: no runner on every push to master. workflow_dispatch never fires on its own,
# it just leaves a "Run workflow" button for when you want a check without opening a PR.
on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Phoenix.Mediator.slnx

      - name: Build
        run: dotnet build Phoenix.Mediator.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Phoenix.Mediator.slnx -c Release --no-build --verbosity normal

      # Packing runs package validation against the last release (see Directory.Build.props), so a change that breaks
      # the public API fails here, on the pull request, rather than when the release tag is pushed.
      - name: Pack
        run: dotnet pack Phoenix.Mediator.slnx -c Release --no-build -o artifacts
