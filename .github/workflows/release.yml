name: Release (NuGet)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Run by hand from a branch, GITHUB_REF_NAME is the branch name, and "master" would be handed to pack as the
      # package version. Pick the release tag under "Use workflow from" instead.
      - name: Compute version from tag
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Run this workflow from a v* tag, not from $GITHUB_REF_TYPE '$GITHUB_REF_NAME'."
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Phoenix.Mediator.slnx

      # No test step: releasing should not pay for a second test run. Tests run on pull requests (ci.yml),
      # so run `dotnet test Phoenix.Mediator.slnx -c Release` locally before tagging.
      - name: Pack
        run: >
          dotnet pack Phoenix.Mediator.slnx
          -c Release
          -o artifacts
          /p:ContinuousIntegrationBuild=true
          /p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --api-key "$NUGET_API_KEY" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
